# Docker Compose setup for testing Ozone S3 Gateway with STS authentication

# reusable fragments (see https://docs.docker.com/compose/compose-file/#extension-fields)
x-common-config:
  &common-config
  image: ${OZONE_RUNNER_IMAGE}:${OZONE_RUNNER_VERSION}
  volumes:
    - ../..:/opt/hadoop
  env_file:
    - docker-config

x-replication:
  &replication
  OZONE-SITE.XML_ozone.server.default.replication: ${OZONE_REPLICATION_FACTOR:-1}

services:
  datanode:
    <<: *common-config
    ports:
      - 19864
      - 9882
    environment:
      <<: *replication
      OZONE_OPTS:
    command: ["ozone","datanode"]

  om:
    <<: *common-config
    environment:
      ENSURE_OM_INITIALIZED: /data/metadata/om/current/VERSION
      OZONE_OPTS:
      <<: *replication
    ports:
      - 9874:9874
      - 9862:9862
    command: ["ozone","om"]

  scm:
    <<: *common-config
    ports:
      - 9876:9876
      - 9860:9860
    environment:
      ENSURE_SCM_INITIALIZED: /data/metadata/scm/current/VERSION
      OZONE-SITE.XML_hdds.scm.safemode.min.datanode: ${OZONE_SAFEMODE_MIN_DATANODES:-1}
      OZONE_OPTS:
    command: ["ozone","scm"]

  s3g:
    <<: *common-config
    environment:
      <<: *replication
      # Enable STS authentication
      OZONE-SITE.XML_ozone.s3g.sts.enabled: "true"
      OZONE-SITE.XML_ozone.s3g.sts.endpoint: "http://sts-server:8080"
      OZONE-SITE.XML_ozone.s3g.sts.region: "us-east-1"
      OZONE-SITE.XML_ozone.s3g.sts.cache.ttl: "300000"
      OZONE-SITE.XML_ozone.s3g.sts.cache.size: "1000"
      OZONE_OPTS:
    ports:
      - 9878:9878
    command: ["ozone","s3g"]
    depends_on:
      - om
      - scm
      - datanode

  # Mock STS Server for testing
  sts-server:
    image: node:18-alpine
    ports:
      - 8080:8080
    volumes:
      - ./sts-server:/app
    working_dir: /app
    command: ["node", "server.js"]
    environment:
      - NODE_ENV=development
      - PORT=8080

  # AWS CLI container for testing
  aws-cli:
    image: amazon/aws-cli:latest
    volumes:
      - ./test-scripts:/scripts
      - ./aws-config:/root/.aws
    working_dir: /scripts
    entrypoint: ["/bin/bash"]
    depends_on:
      - s3g
      - sts-server
    environment:
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_DEFAULT_OUTPUT=json
